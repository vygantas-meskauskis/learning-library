# CI for the BusyHamster monorepo: the gates (chapter 4), the API contract
# (chapter 11) and the risk tier (chapter 9).
# Before the monorepo exists (chapter 10), set working-directory to "." and
# remove the api and contract jobs.
name: ci

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request_review' && 'review-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build must not need the network after npm ci (chapters 4 and 10).
      - name: Build without network
        run: sudo unshare -n -- sudo -u "$USER" env "PATH=$PATH" npm run build

  api:
    if: github.event_name != 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Integration tests use Testcontainers (Docker is available on ubuntu-latest).
      - run: dotnet test --no-build -c Release

  contract:
    if: github.event_name != 'pull_request_review'
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: api/global.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Regenerate the OpenAPI document
        run: dotnet build api -c Release
      - name: Contract is committed
        run: |
          git diff --exit-code -- api/openapi.json || {
            echo "::error::The API contract changed. Run 'dotnet build' in api/ and commit api/openapi.json."
            exit 1
          }
      - name: Generated types are committed
        working-directory: web
        run: |
          npm ci
          npm run api:types
          git diff --exit-code -- app/lib/api-types.ts || {
            echo "::error::Generated API types are out of date. Run 'npm run api:types' in web/ and commit."
            exit 1
          }
          npm run typecheck

  risk-tier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute tier
        id: tier
        run: |
          base=${{ github.event.pull_request.base.sha }}
          tier=$(git diff --name-status "$base"...HEAD | ./scripts/risk-tier.sh)
          # A breaking change to the API contract is tier 2 (chapter 11).
          if git diff --name-only "$base"...HEAD | grep -qx api/openapi.json; then
            if ./scripts/contract-breaking.sh "$base"; then tier=2; fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Risk tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      - name: Label and auto-merge tier 0
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          TIER: ${{ steps.tier.outputs.tier }}
          # Check your Claude GitHub app's bot login on an agent PR (gh pr view <n> --json author).
          AGENT_LOGIN: claude[bot]
        run: |
          gh pr edit "$PR" --remove-label tier:0 --remove-label tier:1 --remove-label tier:2 || true
          gh pr edit "$PR" --add-label "tier:$TIER"
          if [ "$TIER" = "0" ] && [ "$AUTHOR" = "$AGENT_LOGIN" ]; then
            gh pr merge "$PR" --auto --squash
          fi

  tier-gate:
    # A required check: passes only when the tier's approval rule is met (chapter 9).
    needs: [risk-tier]
    # risk-tier is skipped on review events; run anyway and read the existing label.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check approvals for the tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" -R "$REPO" --json labels -q '.labels[].name')
          tier=$(grep -o 'tier:[012]' <<<"$labels" | head -1 | cut -d: -f2)
          tier=${tier:-2}
          approved=$(gh pr view "$PR" -R "$REPO" --json reviews \
            -q '[.reviews[] | select(.state=="APPROVED" and (.authorAssociation=="OWNER" or .authorAssociation=="MEMBER" or .authorAssociation=="COLLABORATOR"))] | length')
          echo "tier=$tier approvals=$approved"
          case "$tier" in
            0) exit 0 ;;
            1) [ "$approved" -ge 1 ] || { echo "::error::Tier 1 needs a maintainer approval."; exit 1; } ;;
            2) [ "$approved" -ge 1 ] && grep -qx 'tier-2-reviewed' <<<"$labels" \
                 || { echo "::error::Tier 2 needs a maintainer approval and the tier-2-reviewed label."; exit 1; } ;;
          esac
